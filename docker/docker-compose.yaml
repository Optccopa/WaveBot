services:
  app:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    container_name: myapp
    depends_on:
      - redis
      - postgres
    expose:
      - "8081"
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  site:
    build:
      context: .
      dockerfile: docker/site.Dockerfile
    container_name: wavebot-panel
    restart: always
    depends_on:
      - redis
      - postgres
    expose:
      - "8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: https://${DOMAIN}/callback
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      PRODUCTION: "true"
      BOT_INTERNAL_URL: http://app:8081
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  postgres_data:
  redis_data:
